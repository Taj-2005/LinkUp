# Cloud Build configuration for automated deployments
steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/linkup-socket-server:$SHORT_SHA', '-t', 'gcr.io/$PROJECT_ID/linkup-socket-server:latest', '.']
    dir: 'socket-server'

  # Push the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/linkup-socket-server:$SHORT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/linkup-socket-server:latest']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'linkup-socket-server'
      - '--image'
      - 'gcr.io/$PROJECT_ID/linkup-socket-server:$SHORT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '3001'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'PORT=3001'
      - '--set-secrets'
      - 'MONGODB_URI=mongodb-uri:latest,JWT_ACCESS_SECRET=jwt-secret:latest,CORS_ORIGIN=cors-origin:latest'

images:
  - 'gcr.io/$PROJECT_ID/linkup-socket-server:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/linkup-socket-server:latest'

options:
  logging: CLOUD_LOGGING_ONLY



